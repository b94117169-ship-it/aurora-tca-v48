<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURORA V48 - Bernardo & Octávio</title>
<style>
body{font-family:Arial;background:#0a0a0a;color:#fff;margin:0;display:flex;flex-direction:column;height:100vh}
header{background:#111;padding:15px;text-align:center;border-bottom:1px solid #333}
#chat{flex:1;overflow-y:auto;padding:20px}
.msg{margin:10px 0;padding:12px;border-radius:10px;max-width:80%}
.user{background:#2563eb;margin-left:auto}
.bot{background:#1f1f1f}
.system{background:#f59e0b;color:#000;text-align:center;margin:10px auto}
footer{display:flex;padding:15px;background:#111;gap:10px}
input{flex:1;padding:12px;border-radius:8px;border:none}
button{padding:12px 20px;background:#2563eb;color:#fff;border:none;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<header>
<h2>🔮 AURORA V48</h2>
<p id="status">⚠️ LIMITADO</p>
</header>
<div id="chat"><div class="msg system">Bem-vindo à AURORA V48 - Chefes: Bernardo e Octávio</div></div>
<footer>
<input id="pergunta" placeholder="Digite Bernardo online...">
<button onclick="enviar()">Enviar</button>
</footer>
<script src="aurora-core.js"></script>
<script>
const chat=document.getElementById('chat'),input=document.getElementById('pergunta'),status=document.getElementById('status');
function addMsg(t,c){let d=document.createElement('div');d.className='msg '+c;d.innerText=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
async function enviar(){let texto=input.value.trim();if(!texto)return;addMsg(texto,'user');input.value='';let r=await AURORA_CORE.perguntar(texto);if(r.includes('ILIMITADO')){status.innerText='✅ '+r;status.style.color='#22c55e';addMsg(r,'system')}else if(r.includes('LIMITADO')||r.includes('Lamento')){status.innerText='⚠️ LIMITADO';status.style.color='#ef4444';addMsg(r,'bot')}else addMsg(r,'bot')}
input.addEventListener('keypress',e=>{if(e.key==='Enter')enviar()});
let role=localStorage.getItem('aurora_role');if(role==='CHEFE'){let n=localStorage.getItem('aurora_nome');status.innerText=`✅ ${n} ONLINE - ILIMITADO`;status.style.color='#22c55e'}
</script>
</body>
</html>
